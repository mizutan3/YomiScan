services:
  - type: web
    name: ocr-server
    runtime: python
    buildCommand: |
      chmod +x build.sh
      ./build.sh
      chmod +x mecab_config.sh
      ./mecab_config.sh
    startCommand: "gunicorn server:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
    env: python
    plan: free
